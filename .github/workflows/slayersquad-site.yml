# Publishes slayersquad.app from the separate slayersquad repo. Only runs there: the squad-draft repo keeps its own Pages site,
# and a CNAME file must never be added, because GitHub would then redirect the old address and strand players' saves.
name: Publish slayersquad.app
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.repository == 'charleskowou1/slayersquad'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish the game only: dev tools and notes stay in the repo. Same list as _config.yml's exclude (the old address).
      - run: rsync -a --exclude=/_site --exclude=/.git --exclude=/.github --exclude=/.gitignore --exclude=/_config.yml --exclude=/tools/ --exclude=/worker/ --exclude=/README.md ./ _site/
      # The game changes with every deploy: date the home page in the sitemap (tools/make-pages.js dates the other pages)
      - run: sed -i "s|<loc>https://slayersquad.app/</loc><lastmod>[^<]*</lastmod>|<loc>https://slayersquad.app/</loc><lastmod>$(date -u +%F)</lastmod>|" _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
