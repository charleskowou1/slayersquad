<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slayer Squad Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--bg:#12100e;--panel:#1d1915;--panel-2:#26211b;--line:#342d25;--line-2:#4f463b;--fg:#efe6d6;--ink-2:#cdbfa8;--muted:#978b79;
  --gold:#d6a54d;--accent:#e0573b;--green:#57c98a;--red:#ff6b57;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",Georgia,serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:15px/1.5 var(--body);background:var(--bg) radial-gradient(1000px 420px at 50% -120px,#3a1d15 0%,transparent 70%) no-repeat;min-height:100vh}
main{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.top img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 0 1px var(--line-2),0 6px 20px #0008}
.top div{flex:1;min-width:0}
h1{margin:0;font:800 1.65rem/1.1 var(--display);letter-spacing:.01em}
.sub{margin:3px 0 0;color:var(--muted);font-size:.85rem}
button{font:500 .88rem var(--body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 14px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#322a22;border-color:var(--gold)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:#ec6a4f}
#refresh.spin{opacity:.6;pointer-events:none}

.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;padding:26px 24px;margin-bottom:14px;border-color:#5a3424;
  background:linear-gradient(100deg,#120d0acc 0%,#120d0a99 45%,#120d0a33 100%),url(img/places/dawn.jpg) center 40%/cover,var(--panel)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),transparent)}
.hero .lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.hero b{display:block;font:800 4.2rem/1 var(--display);margin:6px 0 4px;text-shadow:0 4px 24px #000a;font-variant-numeric:tabular-nums}
.hero .weekbox b{font-size:2.6rem;margin-top:10px}
.hero small{color:var(--ink-2);font-size:.82rem}
.hero .weekbox{align-self:end;justify-self:end;text-align:right;padding:12px 16px;border-radius:12px;background:#0d0a0899;backdrop-filter:blur(6px);border:1px solid #ffffff14}
i.up,i.down{font-style:normal;font-weight:700}i.up{color:var(--green)}i.down{color:var(--red)}
.ranges{position:sticky;top:8px;z-index:5;display:flex;gap:4px;width:max-content;max-width:100%;margin:0 0 14px;padding:4px;border-radius:12px;background:#1d1915e6;border:1px solid var(--line-2);backdrop-filter:blur(8px);box-shadow:0 6px 20px #0007}
.ranges button{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:700}
.ranges button:hover{background:var(--panel-2);color:var(--fg)}
.ranges button.on{background:var(--accent);color:#fff}
.mixnote{margin:-6px 0 12px;color:var(--muted);font-size:.76rem}
.chart .band{fill:#d6a54d0d}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font:800 1.8rem/1.05 var(--display);font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:4px;color:var(--ink-2);font-size:.84rem;font-weight:500}
.tile small{display:block;margin-top:2px;color:var(--muted);font-size:.74rem}
section{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;min-width:0}
section .kj{position:absolute;right:-6px;top:-18px;font:800 6.5rem/1 var(--display);color:#ffffff07;pointer-events:none;user-select:none}
section header{margin-bottom:14px;position:relative}
h2{margin:0;font:700 .76rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
section header p{margin:4px 0 0;color:var(--muted);font-size:.8rem;max-width:56ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-bottom:14px}.grid2 section{margin:0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);font-size:.7rem;letter-spacing:.04em}
.pill.red{color:var(--red);border-color:#6b2a22}

.chart{position:relative}.chart svg{display:block;overflow:visible}
.chart .grid{stroke:#2e2720;stroke-width:1}.chart .ax{fill:var(--muted);font:500 11px var(--body)}.chart .ax.sm{font-size:10px;fill:#6f6556}.chart .ax.now{fill:var(--fg);font-weight:700}
.chart .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--gold);stroke:var(--panel);stroke-width:2}.chart .dot.now{fill:var(--accent)}
.chart .val{fill:var(--fg);font:700 12px var(--body)}.chart .cross{stroke:var(--line-2);stroke-dasharray:3 3}
.tip{display:none;position:absolute;z-index:2;min-width:130px;padding:8px 10px;border-radius:10px;background:#0d0b09f2;border:1px solid var(--line-2);box-shadow:0 8px 24px #000a;font-size:.78rem;pointer-events:none}
.tip b{display:block;margin-bottom:4px}.tip div{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}.tip em{font-style:normal;color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}

.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 16px}.stack i{display:block;min-width:4px}
.legend div{display:grid;grid-template-columns:12px 1fr auto 56px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #2a241e;font-size:.9rem}
.legend div:first-child{border:0;padding-top:0}.legend i{width:12px;height:12px;border-radius:4px}.legend b{font:800 1.1rem var(--display)}.legend small{color:var(--muted);text-align:right;font-size:.78rem}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.mode span{font-weight:500;font-size:.88rem}.mode b{font:800 1.3rem/1 var(--display);grid-row:span 2;align-self:center}
.mode small{color:var(--muted);font-size:.74rem}.mode u{grid-column:1/3;margin-top:8px;display:block;height:4px;border-radius:3px;background:#1a1612;text-decoration:none;overflow:hidden}
.mode u i{display:block;height:100%;background:linear-gradient(90deg,#9c7634,var(--gold));border-radius:3px}

.funnel .frow{display:grid;grid-template-columns:22px 1fr auto;column-gap:8px;row-gap:5px;align-items:center;padding:7px 0;border-top:1px solid #2a241e;font-size:.86rem}
.funnel .frow:first-child{border:0;padding-top:0}.frow em{font-style:normal;color:var(--muted);font-size:.74rem;text-align:right}
.frow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow small{color:var(--muted);font-size:.76rem;white-space:nowrap}.frow small b{color:var(--fg)}
.frow u{grid-column:2/4;position:relative;display:block;height:6px;border-radius:4px;background:#2b241d;text-decoration:none}
.frow u i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#4a3d2c}.frow u i.won{background:linear-gradient(90deg,#9c7634,var(--gold))}
.frow.hard small b{color:var(--red)}
i.tag{font-style:normal;margin-left:4px;padding:0 6px;border-radius:5px;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#40201a;color:var(--red)}

.fighter{display:grid;grid-template-columns:22px 38px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #2a241e}
.fighter:first-child{border:0;padding-top:0}.fighter em{font-style:normal;color:var(--muted);font-size:.74rem;text-align:right}
.fighter img,.fighter .noimg{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid var(--line-2);background:var(--panel-2)}
.fighter:first-child img{border-color:var(--gold)}
.fighter .noimg{display:grid;place-items:center;font:800 1rem var(--display);color:var(--muted)}
.fighter .fn{font-weight:500;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fighter small{color:var(--muted);font-size:.76rem}
.fighter b{min-width:48px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--panel-2);font-size:.82rem;font-variant-numeric:tabular-nums}.fighter b.good{color:var(--green)}
.row{display:grid;grid-template-columns:22px 1fr auto;column-gap:8px;row-gap:5px;align-items:center;padding:7px 0;border-top:1px solid #2a241e;font-size:.88rem}
.row:first-of-type{border-top:0;padding-top:0}
.row em{font-style:normal;color:var(--muted);font-size:.74rem;text-align:right;font-variant-numeric:tabular-nums}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--ink-2);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row u{grid-column:2/4;display:block;height:6px;border-radius:4px;background:#2b241d;text-decoration:none;overflow:hidden}
.row u i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#9c7634,var(--gold))}
.row:first-of-type u i{background:linear-gradient(90deg,#b8462f,var(--accent))}
.empty{margin:0;color:var(--muted);font-size:.86rem}

.rep{padding:12px 0;border-top:1px solid var(--line)}.rep:first-of-type{border:0;padding-top:0}
.rephead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rephead small{flex:1;min-width:0;color:var(--muted);font-size:.76rem}
.rephead button{padding:3px 10px;font-size:.76rem}
.tag{padding:1px 8px;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#2c3a2f;color:var(--green)}
.rep.auto .tag{background:#40201a;color:var(--red)}
.rep p{margin:6px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.rep.auto p{color:#ffb4a6;font:.8rem/1.45 ui-monospace,Menlo,monospace;background:#0e0c0a;border-radius:8px;padding:8px 10px}
.rep .ua{display:block;color:#6f6556;font-size:.7rem;overflow-wrap:anywhere}

.mk{display:flex;gap:8px;flex-wrap:wrap}
select{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px}
.code{display:block;margin-top:10px;font:700 1.2rem ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--gold)}.code:empty{display:none}
.warn{border-color:var(--gold);background:linear-gradient(160deg,#2e2414,var(--panel) 70%)}.warn p{margin:0 0 10px}
pre{margin:0 0 10px;padding:12px;background:#0b0a08;border-radius:10px;overflow-x:auto;font-size:.74rem}
.foot{color:#6f6556;font-size:.72rem;text-align:center;margin-top:24px;overflow-wrap:anywhere}
@media (max-width:620px){.ranges{width:100%}.ranges button{flex:1;padding:7px 4px;font-size:.82rem}h1{font-size:1.35rem}.tiles{grid-template-columns:1fr 1fr}.tile b{font-size:1.5rem}.hero{grid-template-columns:1fr;padding:22px 18px}.hero b{font-size:3.4rem}.hero .weekbox{justify-self:stretch;text-align:left}section{padding:16px}.fighter{grid-template-columns:18px 34px 1fr auto}.fighter small{display:none}.modes{grid-template-columns:1fr 1fr}.mode{padding:10px 12px}.mode b{font-size:1.1rem}}
</style></head><body><main>
<div class="top"><img src="icons/icon-192.png" alt=""><div><h1>Slayer Squad Admin</h1><p class="sub" id="sub">Loading…</p></div><button id="refresh">Refresh</button></div>
<nav class="ranges" id="ranges" aria-label="Time range"></nav>
<div id="out"></div>
</main>
<script src="js/firebase-config.js"></script>
<script src="js/art-list.js"></script>
<script src="js/roster.js"></script>
<script src="js/engine.js"></script>
<script src="js/story.js"></script>
<script src="js/admin.js"></script>
</body></html>
